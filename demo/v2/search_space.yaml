# Search space for demo/v2/toy_adapter.py: every knob the toy pipeline accepts,
# with the values `ragaudit tune` may try. 3 x 2 x 3 x 3 x 2 x 2 = 216 configs.
knobs:
  chunk_size: [20, 40, 80]          # words per retrieval window
  chunk_overlap: [0, 10]            # words shared by consecutive windows
  top_k: [1, 3, 5]                  # corpus chunks retrieved
  hybrid_weight: {min: 0.0, max: 1.0, step: 0.5}   # 0 = BM25 only, 1 = trigram similarity only
  reranker: [none, overlap]
  prompt_variant: [lead, extractive]

# The config the pipeline ships with today: small windows, top-1, the lazy prompt.
baseline:
  chunk_size: 40
  chunk_overlap: 0
  top_k: 1
  hybrid_weight: 0.0
  reranker: none
  prompt_variant: lead
