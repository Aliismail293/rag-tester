[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragaudit"
version = "0.1.0"
description = "Audits RAG pipelines by checking whether retrieval actually did the work, not just whether the answer was correct."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Ali Ekramy Ismail", email = "alii.ekramy.ismail@gmail.com" },
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ragaudit = "ragaudit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ragaudit"]
include = [
    "src/ragaudit/report/templates/*.css",
    "src/ragaudit/report/templates/*.jinja",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/ragaudit/report/templates/*.css",
    "src/ragaudit/report/templates/*.jinja",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
