[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ragaudit"
version = "0.3.0"
description = "Test a RAG pipeline in minutes: catch correct answers that retrieval didn't earn (lucky passes), without re-indexing."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["rag", "retrieval-augmented-generation", "llm", "evaluation", "testing", "langchain", "llamaindex", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
authors = [
    { name = "Ali Ekramy Ismail", email = "alii.ekramy.ismail@gmail.com" },
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://aliismail293.github.io/rag-tester/"
Documentation = "https://github.com/Aliismail293/rag-tester#readme"
Repository = "https://github.com/Aliismail293/rag-tester"
Issues = "https://github.com/Aliismail293/rag-tester/issues"
Changelog = "https://github.com/Aliismail293/rag-tester/blob/main/CHANGELOG.md"

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
yaml = ["pyyaml>=6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=5.1",
]

[project.scripts]
ragaudit = "ragaudit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ragaudit"]
include = [
    "src/ragaudit/report/templates/*.css",
    "src/ragaudit/report/templates/*.jinja",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/ragaudit",
    "tests",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
